<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ⚠️ ตั้งค่า viewport ให้ผู้ใช้สามารถใช้นิ้วซูม (Pinch-to-zoom) เข้าออกได้ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ผังที่นั่งค่าย CVC Prayer #12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-600 shadow-lg text-white px-4 py-8 rounded-b-[2rem] relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-white opacity-10 rounded-full blur-sm"></div>
        <div class="absolute left-10 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full blur-md"></div>
        
        <h1 class="text-2xl font-bold text-center relative z-10 leading-relaxed drop-shadow-md">
            🗺️ ผังที่นั่งห้องประชุม
        </h1>
        <p class="text-indigo-100 text-sm text-center mt-2 relative z-10 font-medium">ค่ายคริสตจักรแห่งนิมิต (CVC) "Prayer"</p>
    </div>

    <!-- ส่วนแสดงผังที่นั่ง -->
    <div class="max-w-3xl mx-auto mt-6 px-4 space-y-4">
        
        <div class="text-center px-4">
            <p class="text-sm font-bold text-indigo-600 bg-indigo-50 shadow-sm border border-indigo-100 py-2 px-5 rounded-full inline-block">
                🔍 สามารถใช้นิ้วซูมเข้า-ออก เพื่อดูรายละเอียดได้
            </p>
        </div>

        <div class="bg-white p-2 rounded-2xl shadow-md border border-gray-100 overflow-hidden">
            <!-- ⚠️ เปลี่ยนลิงก์รูปภาพตรงนี้ ให้เป็นลิงก์ผังที่นั่งของคุณเพลง -->
            <img id="seatingMap" src="https://i.postimg.cc/XqCc4Wyv/Screenshot-2026-07-29-212534.png">
        </div>

        <!-- ปุ่มดาวน์โหลดรูปภาพเก็บไว้ในเครื่อง -->
        <a href="https://via.placeholder.com/800x1200?text=ใส่รูปผังที่นั่งตรงนี้" download="SeatingPlan_CVC.jpg" class="block w-full bg-white text-indigo-600 font-bold text-lg py-4 rounded-2xl shadow-sm hover:shadow-md transition-all text-center border-2 border-indigo-100 mt-4">
            📥 บันทึกรูปผังที่นั่งลงเครื่อง
        </a>

        <!-- ปุ่มกลับไปหน้าหลัก (ถ้ามี) -->
        <button onclick="window.history.back()" class="block w-full bg-gray-100 text-gray-600 font-bold text-base py-3 rounded-2xl shadow-sm hover:bg-gray-200 transition-all text-center mt-4">
            ⬅️ ย้อนกลับ
        </button>

    </div>

</body>
</html>
