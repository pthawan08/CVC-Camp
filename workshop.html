<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน Workshop - CVC Prayer #12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 shadow-lg text-white px-4 py-8 rounded-b-3xl relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-white opacity-10 rounded-full blur-sm"></div>
        <div class="absolute -left-10 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full blur-sm"></div>
        <h1 class="text-2xl font-bold text-center relative z-10">ลงทะเบียน ชั้น Workshop</h1>
        <p class="text-indigo-100 text-sm text-center mt-1 relative z-10">✨ ค่ายคริสตจักรที่ขับเคลื่อนด้วยการอธิษฐาน ✨</p>
    </div>

    <form id="workshopForm" class="max-w-md mx-auto mt-6 px-4 space-y-6">
        
        <!-- 1. เลือกสังกัด -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="font-bold text-gray-800 border-b border-gray-100 pb-2 flex items-center">
                <span class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm mr-2 shadow-inner">1</span> เลือกสังกัดของคุณ
            </h2>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ภาคพันธกิจ / สังกัดหลัก</label>
                <select id="regionSelect" onchange="onRegionChange()" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50/50 text-gray-800 font-semibold">
                    <option value="">-- เลือกภาคพันธกิจ --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">คริสตจักร / หน่วย (แขวง)</label>
                <select id="churchSelect" onchange="onChurchChange()" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50/50 text-gray-800 font-semibold" disabled>
                    <option value="">-- เลือกลิสต์คริสตจักร --</option>
                </select>
            </div>

            <div id="statusBox" class="hidden p-3 rounded-xl text-xs flex items-center space-x-2"></div>

            <!-- 🟢 กล่องสรุปยอดแบบ Real-time -->
            <div id="summaryBox" class="hidden bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 p-4 rounded-xl space-y-2 mt-4 shadow-sm">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-bold text-gray-600">👥 สมัครค่ายทั้งหมด:</span>
                    <span class="font-extrabold text-blue-700 text-base" id="displayTotalCamp">0 คน</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="font-bold text-gray-600">📝 ลง Workshop แล้ว:</span>
                    <span class="font-extrabold text-emerald-600 text-base" id="displayTotalWorkshop">0 คน</span>
                </div>
                <div class="w-full h-px bg-blue-200 my-1"></div>
                <div class="flex justify-between items-center">
                    <span class="font-bold text-gray-700">⚠️ คงเหลือต้องจัดลงห้อง:</span>
                    <span class="font-black text-red-500 text-lg" id="displayRemaining">0 คน</span>
                </div>
            </div>
        </div>

        <!-- 2. เลือกระบุจำนวนและรายชื่อ -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-5">
            <h2 class="font-bold text-gray-800 border-b border-gray-100 pb-2 flex items-center">
                <span class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full inline-flex items-center justify-center text-sm mr-2 shadow-inner">2</span> ระบุจำนวนคนและรายชื่อ
            </h2>
            <div id="workshopList" class="space-y-4"></div>
        </div>

        <button type="button" onclick="submitWorkshop()" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-lg py-4 rounded-2xl shadow-lg hover:opacity-90 transition border border-indigo-700">
            💾 บันทึกการลงทะเบียน Workshop
        </button>

    </form>

    <script>
        // ⚠️ เอา Web App URL จาก Google Apps Script มาวางตรงนี้ ⚠️
        const scriptURL = "https://script.google.com/macros/s/AKfycbzt3qj7QYYuKRG2b_o5jw9p06hSylXVQOCK9ef-UJ7C2B-n_289fS0ErYvI7uhDROJbcQ/exec";

        const churchData = {
            "CVC พิษณุโลก": ["BeOne", "BeTwo", "RU", "CL", "NU 1", "NU 2", "NU 3", "NewSeason A", "NewSeason B", "NGP A", "NGP B", "NGP C", "V-Gen A1", "V-Gen A2", "V-Gen B1", "V-Gen B2", "V-Gen B3", "Acts A", "Acts B", "Acts C", "Acts D", "เยรูซาเลม1", "เยรูซาเลม2", "Power Eagle 1", "Power Eagle 2", "Power Eagle 3", "Happiness 1", "Happiness 2", "Unity 1", "Unity 2"],
            "ภาคพันธกิจที่ 1": ["CVC ลำพูน", "CVC บ้านโฮ่ง", "CVC บ้านธิ", "CVC เวียงหนองล่อง", "CVC ป่าซาง", "CVC ทิพเนตร", "CVC แม่ฮ่องสอน", "CVC แม่สะเรียง", "CVC ขุนยวม", "CVC สบเมย", "CVC นครเชียงใหม่", "CVC นครลำปาง", "CVC วังเหนือ", "CVC แม่ทา", "CVC เมืองปาน", "CVC ลี้"],
            "ภาคพันธกิจที่ 2": ["CVC เชียงราย", "CVC แม่สรวย", "CVC ห้วยนากาด", "CVC เวียงป่าเป้า", "CVC เชียงคำ", "CVC พะเยา", "CVC พะเยา 2", "CVC น่าน", "CVC แม่สาย", "CVC แพร่"],
            "ภาคพันธกิจที่ 3": ["CVC บางระกำ", "CVC พรหมพิราม", "CVC บางกระทุ่ม", "CVC วังทอง", "CVC นครไทย", "CVC บ้านแยง", "CVC ชาตระการ", "CVC วัดโบสถ์", "CVC ชุมชุนชาวแพ", "CVC โตกำแพง", "CVC เขาไร่", "CVC เนินมะปราง", "CVC ทรัพย์ไพรวัลย์", "CVC เขาค้อ (ไฮแลนด์)", "CVC อุตรดิตถ์"],
            "ภาคพันธกิจที่ 4": ["CVC นครแม่สอด", "CVC ห้วยกะโหลก", "CVC นครสวรรค์", "CVC ลาดยาว", "CVC อุทัยธานี", "CVC น้ำรอบ", "CVC ลานสัก", "CVC ชัยนาท", "CVC สุพรรณบุรี", "CVC พบพระ", "CVC อุ้มผาง", "CVC หนองบัว", "CVC วังน้ำขาว", "CVC บ้านหมี่", "CVC บางพล้อ", "CVC บรรพต", "CVC โกรกพระ", "CVC ตาคลี", "CVC ตากฟ้า", "CVC ชุมตาบง", "CVC แม่วงก์", "CVC แม่เปิน", "CVC อยุธยา", "CVC แม่ละมาด", "CVC อ.เมือง ตาก", "CVC ท่าสองยาง", "CVC สว่างอารมภ์", "CVC เมืองอุทัยธานี"],
            "ภาคพันธกิจที่ 5": ["CVC กำแพงเพชร", "CVC ขาณุวรลักษณ์", "CVC ไทรพัฒนา", "CVC เพชรบูรณ์", "CVC บ้านน้ำร้อน", "CVC สุโขทัย", "CVC กงไกรลาศ", "CVC พิจิตร", "CVC สามง่าม", "CVC บึงนารา", "CVC คลองขลุง", "CVC สากเหล็ก", "CVC เขาทราย", "CVC เข็กน้อย", "CVC วิเชียรบุรี", "CVC บ้านแม่ท่าแพ", "CVC บ้านห้วยหยวก", "CVC ห้วยมะนาว", "CVC สวรรคโลก", "CVC ไผ่ท่าโพธิ์", "CVC ห้วยแย้", "CVC โคราช", "CVC กลางหมื่น", "CVC ขอนแก่น", "CVC อุดรธานี", "CVC หนองคาย", "CVC กรุงเทพมหานคร", "CVC สมุทปราการ", "CVC กบินทร์บุรี (จ.ปราจีนบุรี)", "CVC ชลบุรี", "CVC เกาะสมุย (จ.สุราษฏร์ธานี)", "CVC มาบอำมฤต (จ.ชุมพร)", "CVC โป๊ะหมอ (หาดใหญ่)", "CVC ปราณบุรี (ประจวบคีรีขันธ์)", "CVC สเปน (บาเซโลน่า)", "CVC นอร์เวย์ ( ออสโล )", "CVC เบียล ( สวิตเซอร์แลนด์ )", "CVC บาเซิล ( สวิตเซอร์แลนด์ )", "CVC ธูน ( สวิตเซอร์แลนด์ )", "CVC นครหลวงเวียงจันทร์", "CVC หลัก 32 ( อุดมไซ ลาว )"]
        };

        const workshops = [
            { id: "ws1", title: "1. ชีวิตที่สนิทสนมกับพระเจ้า", icon: "🍇", color: "bg-emerald-50 border-emerald-200 text-emerald-800" },
            { id: "ws2", title: "2. การอธิษฐานเพื่อการรักษาโรค", icon: "❤️", color: "bg-red-50 border-red-200 text-red-800" },
            { id: "ws3", title: "3. การอธิษฐานที่เปลี่ยนชีวิต", icon: "🕊️", color: "bg-blue-50 border-blue-200 text-blue-800" },
            { id: "ws4", title: "4. สงครามฝ่ายวิญญาณ", icon: "🛡️", color: "bg-orange-50 border-orange-200 text-orange-800" },
            { id: "ws5", title: "5. กลุ่มเยาวชน (Youth) *รับเฉพาะอนุชน", icon: "⭐", color: "bg-yellow-50 border-yellow-200 text-yellow-800" }
        ];

        window.currentCampTotal = 0; // เก็บยอดค่ายไว้คำนวณ

        function initRegions() {
            const select = document.getElementById("regionSelect");
            for (let r in churchData) {
                let opt = document.createElement("option");
                opt.value = r; opt.innerText = r;
                select.appendChild(opt);
            }
            renderWorkshops();
        }

        function onRegionChange() {
            const reg = document.getElementById("regionSelect").value;
            const churchSel = document.getElementById("churchSelect");
            churchSel.innerHTML = '<option value="">-- เลือกลิสต์คริสตจักร --</option>';
            document.getElementById("summaryBox").classList.add("hidden");
            
            if (reg && churchData[reg]) {
                churchSel.disabled = false;
                churchData[reg].forEach(c => {
                    let opt = document.createElement("option");
                    opt.value = c; opt.innerText = c;
                    churchSel.appendChild(opt);
                });
            } else {
                churchSel.disabled = true;
            }
        }

        function renderWorkshops() {
            const container = document.getElementById("workshopList");
            let html = "";
            workshops.forEach(ws => {
                html += `
                    <div class="border rounded-2xl p-4 ${ws.color} transition relative">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center space-x-3 pr-2">
                                <span class="text-2xl">${ws.icon}</span>
                                <h3 class="font-bold text-sm leading-snug">${ws.title}</h3>
                            </div>
                            <div id="quota_${ws.id}" class="bg-white/80 px-2 py-1 rounded-lg shadow-sm border border-black/5 text-[10px] font-bold text-gray-500 whitespace-nowrap">
                                ⏳ รอโหลดยอดรวม...
                            </div>
                        </div>
                        <div class="space-y-2 mt-3">
                            <div>
                                <label class="block text-xs font-semibold mb-1">จำนวนคนลงทะเบียน</label>
                                <input type="number" min="0" id="count_${ws.id}" oninput="calculateTotals()" placeholder="0" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">รายชื่อผู้เข้าร่วม (คั่นด้วยเครื่องหมายจุลภาค , )</label>
                                <textarea id="names_${ws.id}" rows="2" placeholder="เช่น สมชาย ใจดี, สมหญิง มีสุข..." class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 🟢 ฟังก์ชันคำนวณยอดแบบ Real-time
        function calculateTotals() {
            let totalWs = 0;
            workshops.forEach(ws => {
                let val = parseInt(document.getElementById(`count_${ws.id}`).value) || 0;
                totalWs += val;
            });
            
            let remaining = window.currentCampTotal - totalWs;
            
            document.getElementById("displayTotalCamp").innerText = window.currentCampTotal + " คน";
            document.getElementById("displayTotalWorkshop").innerText = totalWs + " คน";
            
            let remainEl = document.getElementById("displayRemaining");
            
            if (remaining === 0) {
                remainEl.className = "font-black text-green-600 text-lg";
                remainEl.innerText = "✅ ครบถ้วนพอดี";
            } else if (remaining < 0) {
                remainEl.className = "font-black text-red-600 text-lg";
                remainEl.innerText = "❌ เกินมา " + Math.abs(remaining) + " คน!";
            } else {
                remainEl.className = "font-black text-orange-500 text-lg";
                remainEl.innerText = remaining + " คน";
            }
        }

        async function onChurchChange() {
            const church = document.getElementById("churchSelect").value;
            const statusBox = document.getElementById("statusBox");
            if (!church) return;

            statusBox.className = "p-3 rounded-xl text-xs flex items-center space-x-2 bg-yellow-50 text-yellow-800 border border-yellow-200";
            statusBox.innerHTML = "⏳ กำลังดึงข้อมูลยอดผู้ลงทะเบียน...";
            statusBox.classList.remove("hidden");
            document.getElementById("summaryBox").classList.add("hidden");

            try {
                const response = await fetch(`${scriptURL}?action=getWorkshopData&church=${encodeURIComponent(church)}`, {
                    method: 'GET',
                    redirect: 'follow'
                });

                const res = await response.json();

                if (res.status === "success") {
                    statusBox.className = "p-3 rounded-xl text-xs flex items-center space-x-2 bg-green-50 text-green-800 border border-green-200";
                    statusBox.innerHTML = "✅ ดึงข้อมูลสำเร็จ!";
                    
                    window.currentCampTotal = res.totalCampMembers || 0;
                    document.getElementById("summaryBox").classList.remove("hidden");

                    if (res.data) {
                        workshops.forEach(ws => {
                            if (res.data[ws.id]) {
                                document.getElementById(`count_${ws.id}`).value = res.data[ws.id].count || "";
                                document.getElementById(`names_${ws.id}`).value = res.data[ws.id].names || "";
                            }
                        });
                    }

                    // 🟢 อัปเดตป้ายโชว์แค่ยอดรวมทั้งหมดของแต่ละคลาส
                    if (res.globalTotals) {
                        workshops.forEach(ws => {
                            let used = res.globalTotals[ws.id] || 0;
                            let badge = document.getElementById(`quota_${ws.id}`);
                            
                            badge.innerHTML = `👥 ยอดคลาสนี้ ${used} คน`;
                            badge.className = "bg-indigo-100 px-2 py-1 rounded-lg shadow-sm border border-indigo-200 text-[11px] font-bold text-indigo-700 whitespace-nowrap";
                        });
                    }
                    
                    calculateTotals();

                } else {
                    throw new Error("Data error");
                }
            } catch (err) {
                console.error(err);
                statusBox.className = "p-3 rounded-xl text-xs flex items-center space-x-2 bg-blue-50 text-blue-800 border border-blue-200";
                statusBox.innerHTML = "ℹ️ พร้อมลงทะเบียนใหม่ (ยังไม่มีข้อมูลเดิม)";
                window.currentCampTotal = 0;
                document.getElementById("summaryBox").classList.remove("hidden");
                
                // ถ้ายกดึงข้อมูลไม่สำเร็จ หรือเป็นคริสตจักรใหม่ ให้แสดงยอด 0 ไปก่อน
                workshops.forEach(ws => {
                    let badge = document.getElementById(`quota_${ws.id}`);
                    badge.innerHTML = `👥 ยอดคลาสนี้ 0 คน`;
                    badge.className = "bg-indigo-100 px-2 py-1 rounded-lg shadow-sm border border-indigo-200 text-[11px] font-bold text-indigo-700 whitespace-nowrap";
                });

                calculateTotals();
            }
        }

        async function submitWorkshop() {
            const region = document.getElementById("regionSelect").value;
            const church = document.getElementById("churchSelect").value;

            if (!region || !church) {
                alert("⚠️ กรุณาเลือกภาคพันธกิจ และคริสตจักรให้ครบถ้วนก่อนครับ");
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.innerHTML = "⏳ กำลังบันทึกข้อมูล...";
            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");

            let payload = {
                action: "saveWorkshop",
                region: region,
                church: church,
                w1: document.getElementById('count_ws1') ? document.getElementById('count_ws1').value : "",
                w2: document.getElementById('count_ws2') ? document.getElementById('count_ws2').value : "",
                w3: document.getElementById('count_ws3') ? document.getElementById('count_ws3').value : "",
                w4: document.getElementById('count_ws4') ? document.getElementById('count_ws4').value : "",
                w5: document.getElementById('count_ws5') ? document.getElementById('count_ws5').value : "",
                w1n: document.getElementById('names_ws1') ? document.getElementById('names_ws1').value : "",
                w2n: document.getElementById('names_ws2') ? document.getElementById('names_ws2').value : "",
                w3n: document.getElementById('names_ws3') ? document.getElementById('names_ws3').value : "",
                w4n: document.getElementById('names_ws4') ? document.getElementById('names_ws4').value : "",
                w5n: document.getElementById('names_ws5') ? document.getElementById('names_ws5').value : ""
            };

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify(payload)
                });

                const res = await response.json();

                // 🟢 แก้ไขตรงนี้: ให้รองรับทั้งคำว่า status และ result โค้ดจะได้คุยกันรู้เรื่องครับ!
                if (res.status === "success" || res.result === "success") {
                    alert("🎉 บันทึกการลงทะเบียน Workshop เรียบร้อยแล้วครับ!");
                    window.location.reload();
                } else {
                    alert("❌ เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง");
                    btn.innerHTML = "💾 บันทึกการลงทะเบียน Workshop";
                    btn.disabled = false;
                    btn.classList.remove("opacity-50", "cursor-not-allowed");
                }
            } catch (err) {
                console.error(err);
                alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล");
                btn.innerHTML = "💾 บันทึกการลงทะเบียน Workshop";
                btn.disabled = false;
                btn.classList.remove("opacity-50", "cursor-not-allowed");
            }
        }

        document.addEventListener("DOMContentLoaded", initRegions);
    </script>
</body>
</html>
